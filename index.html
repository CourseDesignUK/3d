<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dräger PSS 7000 SCBA - Auto-Loader</title>
  <style>
    :root {
      --bg: #090d14;
      --panel: rgba(14, 20, 32, 0.94);
      --border: #1e293b;
      --accent: #ff6600;
      --accent-glow: rgba(255, 102, 0, 0.4);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --mono: 'SF Mono', 'JetBrains Mono', 'Consolas', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #webgl-container { position: absolute; inset: 0; z-index: 1; }
    #leader-canvas { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    #labels-container { position: absolute; inset: 0; z-index: 3; pointer-events: none; }

    .header-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: linear-gradient(180deg, rgba(9,13,20,0.98) 0%, rgba(9,13,20,0) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .badge {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 1px;
    }
    .title { font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

    .hud-panel {
      position: absolute;
      top: 66px;
      left: 20px;
      z-index: 10;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 16px;
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.6;
      width: 250px;
    }
    .hud-title { color: var(--accent); font-weight: bold; margin-bottom: 6px; text-transform: uppercase; font-size: 10px; }
    .status-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .status-ok { color: #10b981; font-weight: bold; }
    .status-prog { color: var(--accent); font-weight: bold; }
    .status-err { color: #ef4444; font-weight: bold; }

    .inspector {
      position: absolute;
      top: 66px;
      right: 20px;
      width: 320px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      z-index: 10;
    }
    .insp-tag { font-family: var(--mono); font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: bold; }
    .insp-title { font-size: 16px; font-weight: 700; margin: 4px 0 8px 0; }
    .insp-desc { font-size: 12px; line-height: 1.5; color: var(--muted); margin-bottom: 12px; }
    .spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .spec-k { font-size: 9px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; }
    .spec-v { font-size: 11px; color: #fff; font-weight: 600; font-family: var(--mono); }

    .control-deck {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }
    .slider-wrap { display: flex; align-items: center; gap: 10px; }
    .deck-txt { font-family: var(--mono); font-size: 11px; color: var(--muted); text-transform: uppercase; }
    input[type=range] {
      width: 180px;
      -webkit-appearance: none;
      background: #1e293b;
      height: 5px;
      border-radius: 3px;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .pct { font-family: var(--mono); font-size: 12px; min-width: 38px; color: var(--accent); font-weight: bold; }

    button.btn {
      background: #1e293b;
      color: #fff;
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 11px;
      font-family: var(--mono);
      font-weight: 600;
      cursor: pointer;
    }
    button.btn:hover { background: #283548; border-color: var(--accent); }
    button.btn-accent { background: var(--accent); color: #000; border-color: var(--accent); }

    .annotation-badge {
      position: absolute;
      pointer-events: auto;
      transform: translate(0, -50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #334155;
      border-left: 3px solid var(--accent);
      padding: 4px 8px;
      border-radius: 3px;
      font-size: 10px;
      font-family: var(--mono);
      color: #fff;
      white-space: nowrap;
      cursor: pointer;
    }
    .annotation-badge.active, .annotation-badge:hover {
      border-color: var(--accent);
      background: #1e293b;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .annotation-badge span { color: var(--accent); font-weight: bold; margin-right: 4px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <header class="header-bar">
    <div class="brand">
      <span class="badge">DRÄGER</span>
      <span class="title">PSS 7000 SCBA Modular Exploded View</span>
    </div>
  </header>

  <div class="hud-panel">
    <div class="hud-title">Root Asset Loading</div>
    <div class="status-row"><span>body.glb:</span><span id="st-body" class="status-prog">FETCHING</span></div>
    <div class="status-row"><span>mask.glb:</span><span id="st-mask" class="status-prog">FETCHING</span></div>
    <div class="status-row"><span>tank.glb:</span><span id="st-tank" class="status-prog">FETCHING</span></div>
  </div>

  <div class="inspector" id="inspector">
    <div class="insp-tag" id="insp-tag">ASSEMBLY VIEW</div>
    <h2 class="insp-title" id="insp-title">Select Module</h2>
    <p class="insp-desc" id="insp-desc">Click labels or meshes to inspect Dräger operational data.</p>
    <div class="spec-grid">
      <div><div class="spec-k">Part No</div><div class="spec-v" id="card-pno">--</div></div>
      <div><div class="spec-k">Material</div><div class="spec-v" id="card-mat">--</div></div>
      <div><div class="spec-k">Working Spec</div><div class="spec-v" id="card-flow">--</div></div>
      <div><div class="spec-k">Standard</div><div class="spec-v" id="card-serv">--</div></div>
    </div>
  </div>

  <div class="control-deck">
    <button class="btn btn-accent" id="btn-assemble">ASSEMBLE</button>
    <div class="slider-wrap">
      <span class="deck-txt">Displacement</span>
      <input type="range" id="explode-slider" min="0" max="100" value="0">
      <span class="pct" id="pct-label">0%</span>
    </div>
    <button class="btn" id="btn-explode">EXPLODE</button>
  </div>

  <div id="webgl-container"></div>
  <canvas id="leader-canvas"></canvas>
  <div id="labels-container"></div>

  <script>
    const MODULE_METADATA = {
      body: {
        file: './body.glb',
        name: 'Chassis & Reducer Harness',
        tag: 'CARRIER & PNEUMATICS',
        desc: 'DEFHALM carbon composite backplate with 3-position torso adjustment, balanced piston pressure reducer, and Bodyguard 7000 telemetry unit.',
        pno: '3356801',
        mat: 'Carbon / Aramid',
        flow: '8.0 Bar Nom',
        serv: 'EN 137 Type 2',
        vector: new THREE.Vector3(0, 0, 0)
      },
      mask: {
        file: './mask.glb',
        name: 'FPS 7000 Full Face Mask',
        tag: 'PPE // RESPIRATORY',
        desc: 'EPDM distortion-free panoramic polycarbonate mask with speech diaphragm and HUD display coupling.',
        pno: 'R56200',
        mat: 'Polycarbonate / EPDM',
        flow: 'EN 136 Class 3',
        serv: 'NFPA 1981',
        vector: new THREE.Vector3(0, 1.4, 0.8)
      },
      tank: {
        file: './tank.glb',
        name: '6.8L 300 Bar Cylinder',
        tag: 'STORAGE // COMPRESSED AIR',
        desc: 'Carbon composite overwrap cylinder with aluminum liner, ratchet cylinder valve, and excess flow limiter.',
        pno: '3355068',
        mat: 'Carbon / Al 6061',
        flow: '300 Bar (2040 L)',
        serv: 'BS EN 12245',
        vector: new THREE.Vector3(0, 0, 1.6)
      }
    };

    const container = document.getElementById('webgl-container');
    const leaderCanvas = document.getElementById('leader-canvas');
    const ctx = leaderCanvas.getContext('2d');
    const labelsContainer = document.getElementById('labels-container');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090d14);
    scene.fog = new THREE.FogExp2(0x090d14, 0.08);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3.2, 1.8, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const grid = new THREE.GridHelper(10, 20, 0xff6600, 0x1e293b);
    grid.position.y = -1.4;
    scene.add(grid);

    scene.add(new THREE.AmbientLight(0xffffff, 1.0));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight1.position.set(5, 8, 6);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xff6600, 0.7);
    dirLight2.position.set(-5, -2, -4);
    scene.add(dirLight2);

    const assemblyGroup = new THREE.Group();
    scene.add(assemblyGroup);

    const loadedModules = new Map();
    let currentExplodeRatio = 0;
    let targetExplodeRatio = 0;
    let activeModuleId = null;

    const loader = new THREE.GLTFLoader();

    function registerGLTF(key, root) {
      const meta = MODULE_METADATA[key];
      root.userData = {
        id: key,
        ...meta,
        initialPos: root.position.clone()
      };

      root.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      assemblyGroup.add(root);
      loadedModules.set(key, root);

      const st = document.getElementById(`st-${key}`);
      st.innerText = 'LOADED';
      st.className = 'status-ok';

      if (loadedModules.size === 3) {
        normalizeScene();
        createBadges();
      }
    }

    function normalizeScene() {
      const box = new THREE.Box3().setFromObject(assemblyGroup);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      if (maxDim > 10) {
        const factor = 2.0 / maxDim;
        assemblyGroup.scale.setScalar(factor);
      }

      const center = box.getCenter(new THREE.Vector3());
      assemblyGroup.position.sub(center.multiplyScalar(assemblyGroup.scale.x));
      controls.target.set(0, 0, 0);
    }

    function attemptDirectFetch(key) {
      const meta = MODULE_METADATA[key];
      const st = document.getElementById(`st-${key}`);

      loader.load(
        meta.file,
        (gltf) => registerGLTF(key, gltf.scene),
        (xhr) => {
          if (xhr.lengthComputable) {
            const pct = Math.round((xhr.loaded / xhr.total) * 100);
            st.innerText = `${pct}%`;
          }
        },
        () => {
          st.innerText = 'FAILED';
          st.className = 'status-err';
        }
      );
    }

    // Direct initialization
    ['body', 'mask', 'tank'].forEach(attemptDirectFetch);

    function createBadges() {
      labelsContainer.innerHTML = '';
      let idx = 1;
      loadedModules.forEach((mod) => {
        const badge = document.createElement('div');
        badge.className = 'annotation-badge';
        badge.innerHTML = `<span>0${idx++}</span>${mod.userData.name}`;
        badge.onclick = (e) => {
          e.stopPropagation();
          selectModule(mod);
        };
        labelsContainer.appendChild(badge);
        mod.userData.badgeEl = badge;
      });
    }

    function selectModule(mod) {
      activeModuleId = mod.userData.id;
      document.getElementById('insp-tag').innerText = mod.userData.tag;
      document.getElementById('insp-title').innerText = mod.userData.name;
      document.getElementById('insp-desc').innerText = mod.userData.desc;
      document.getElementById('card-pno').innerText = mod.userData.pno;
      document.getElementById('card-mat').innerText = mod.userData.mat;
      document.getElementById('card-flow').innerText = mod.userData.flow;
      document.getElementById('card-serv').innerText = mod.userData.serv;

      document.querySelectorAll('.annotation-badge').forEach(b => b.classList.remove('active'));
      if (mod.userData.badgeEl) mod.userData.badgeEl.classList.add('active');

      const targetPos = new THREE.Vector3();
      mod.getWorldPosition(targetPos);
      controls.target.copy(targetPos);
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.control-deck') || e.target.closest('.inspector') || e.target.closest('.header-bar') || e.target.closest('.hud-panel') || e.target.closest('.annotation-badge')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const arr = Array.from(loadedModules.values());
      const hits = raycaster.intersectObjects(arr, true);

      if (hits.length > 0) {
        let rootMod = hits[0].object;
        while (rootMod.parent && !arr.includes(rootMod)) {
          rootMod = rootMod.parent;
        }
        if (arr.includes(rootMod)) selectModule(rootMod);
      }
    });

    const slider = document.getElementById('explode-slider');
    const pctLabel = document.getElementById('pct-label');

    slider.addEventListener('input', (e) => {
      targetExplodeRatio = parseFloat(e.target.value) / 100;
      pctLabel.innerText = `${e.target.value}%`;
    });

    document.getElementById('btn-assemble').addEventListener('click', () => {
      targetExplodeRatio = 0;
      slider.value = 0;
      pctLabel.innerText = '0%';
    });

    document.getElementById('btn-explode').addEventListener('click', () => {
      targetExplodeRatio = 1.0;
      slider.value = 100;
      pctLabel.innerText = '100%';
    });

    function updateLines() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      leaderCanvas.width = width;
      leaderCanvas.height = height;
      ctx.clearRect(0, 0, width, height);

      const pos = new THREE.Vector3();

      loadedModules.forEach((mod) => {
        const badge = mod.userData.badgeEl;
        if (!badge) return;

        mod.getWorldPosition(pos);
        pos.project(camera);

        if (pos.z > 1) {
          badge.style.display = 'none';
          return;
        }

        badge.style.display = 'block';
        const sx = (pos.x * 0.5 + 0.5) * width;
        const sy = (-pos.y * 0.5 + 0.5) * height;

        const isRight = sx > width * 0.5;
        const targetX = isRight ? sx + 90 : sx - 90;

        badge.style.left = `${isRight ? targetX : targetX - badge.offsetWidth}px`;
        badge.style.top = `${sy}px`;

        ctx.beginPath();
        ctx.strokeStyle = mod.userData.id === activeModuleId ? '#ff6600' : 'rgba(255, 102, 0, 0.4)';
        ctx.lineWidth = mod.userData.id === activeModuleId ? 2 : 1;
        ctx.setLineDash([4, 4]);

        ctx.arc(sx, sy, 3, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + (isRight ? 35 : -35), sy);
        ctx.lineTo(targetX, sy);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      currentExplodeRatio += (targetExplodeRatio - currentExplodeRatio) * 0.1;

      loadedModules.forEach((mod) => {
        const init = mod.userData.initialPos;
        const delta = mod.userData.vector.clone().multiplyScalar(currentExplodeRatio);
        mod.position.copy(init).add(delta);
      });

      controls.update();
      renderer.render(scene, camera);
      updateLines();
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
